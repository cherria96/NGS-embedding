# REAL RESEARCH CONFIG TEMPLATE -- item-16 default settings (6 outer / 4
# inner folds, bootstrap_sites=500, candidate_budget=48, item-9 default
# 0.10 prevalence thresholds). NOT runnable as-is for regression:
# `columns.target` is deliberately null. data/final/metadata.csv is NOT
# used anywhere in this config (explicit instruction; it is stale -- see
# fusionML/chemistry_targets.py's docstring for a live diff of eff_CH4
# differing by up to 19.4 points from the current workbook).
#
# For REGRESSION: this dataset has no literal "methane yield" column. The
# closest continuous, non-sCOD/non-ALK candidates, read live from
# Dat_chem.xlsx's Chem_Se.Avg via the chemistry: block below, are
# effluent.CH4 (% CH4 in biogas -- composition, not a yield/rate),
# effluent.CO2, effluent.H2S, effluent.O2. None of these is methane yield,
# and picking one is a scientific decision for the user to make and
# document (item 9), not something this pipeline may guess. `--mode
# validate` will refuse to mark this config ready_to_run until
# columns.target names a real column (or the config is extended with a
# documented derivation).
#
# For CLASSIFICATION: set task: classification and columns.target to one
# of the 5 real, documented flags fusionML/chemistry_targets.py computes
# from Chem_Se.Avg (verbatim formulas from code/metadata_targetwriter.py):
# warning_acid_base_balance, warning_buffer_capacity,
# warning_acid_accumulation, warning_ammonia_toxicity, warning_biogas_quality.
# Smoke-scale real runs of all 5 (configs/real_smoke_classification.yaml)
# found warning_ammonia_toxicity best-powered (pooled AUC-ROC ~0.91-0.93);
# warning_acid_accumulation and warning_biogas_quality have too few
# positives (4 and 6-7 of ~134) for a reliable estimate at any fold count.
#
# See configs/real_smoke.yaml for a SEPARATE, explicitly-labeled smoke
# config that uses effluent.CH4 as a placeholder purely to exercise the
# pipeline end to end -- do not reuse its results as a scientific baseline.
seed: 20260917
task: regression
resolution: asv
inputs:
  arc_counts: ../../datasets/fusionML/real_data_cache/ARC_table_filtered_roundno.tsv
  bac_counts: ../../datasets/fusionML/real_data_cache/BAC_table_filtered_roundno.tsv
  metadata: null   # deliberately null -- do not point this at data/final/metadata.csv
  arc_tree: ../../datasets/raw/qiimeresult/ARC/rooted-tree.nwk
  bac_tree: ../../datasets/raw/qiimeresult/BAC/rooted-tree.nwk
  arc_taxonomy: ../../datasets/raw/qiimeresult/ARC/metadata.tsv
  bac_taxonomy: ../../datasets/raw/qiimeresult/BAC/metadata.tsv
  orientation: features_by_samples
  exploratory_block_list: null
  rank_trees:
    genus:
      arc: ../../datasets/processed/genus_tree/taxlevel_autorun/genus/arc_tree.nwk
      bac: ../../datasets/processed/genus_tree/taxlevel_autorun/genus/bac_tree.nwk
    family:
      arc: ../../datasets/processed/genus_tree/taxlevel_autorun/family/arc_tree.nwk
      bac: ../../datasets/processed/genus_tree/taxlevel_autorun/family/bac_tree.nwk
    order:
      arc: ../../datasets/processed/genus_tree/taxlevel_autorun/order/arc_tree.nwk
      bac: ../../datasets/processed/genus_tree/taxlevel_autorun/order/bac_tree.nwk
    class:
      arc: ../../datasets/processed/genus_tree/taxlevel_autorun/class/arc_tree.nwk
      bac: ../../datasets/processed/genus_tree/taxlevel_autorun/class/bac_tree.nwk
chemistry:
  workbook: ../../datasets/raw/final/Dat_chem.xlsx
  engine: openpyxl
  inspected_sha256: 619aa196e36ca62621fd7bb1360dd6145698c6f59345a2d5841e4d266b562efe
  layout: wide_measurement_by_season
  excel_row_numbering: one_based
  title_row: 1
  season_header_row: 2
  measurement_header_row: 3
  data_start_row: 4
  data_only: true
  preserve_cell_provenance: true
  strip_header_whitespace: true
  row_filter: nonblank_source_site_code
  ignore_blank_separator_columns: true
  assert_configured_headers: true
  fail_on_unmapped_measurement_columns: true
  sheets:
    substrate:
      name: Chem_Si.Avg
      header_row: 3
      sample_id_column: null
      site_id_column: ADP_6
      site_id_excel_column: C
      acronym_column: Acronym
      acronym_excel_column: D
      record_number_column: No.
      record_number_excel_column: B
      record_number_dtype: string
      season_column: null
      namespace: substrate
      already_q_weighted: true
      recompute_weighted_average: false
      static_fields:
        Q_T_per_y:
          excel_column: E
          expected_header: "Q (T/y)"
          units: T/y
          role: annual_site_attribute
          broadcast_to_seasons: true
          include_as_predictor: false
      seasonal_measurement_columns:
        pH: {1: F, 2: G, 3: H, 4: I}
        ALK: {1: K, 2: L, 3: M, 4: N}
        TS: {1: P, 2: Q, 3: R, 4: S}
        VS: {1: U, 2: V, 3: W, 4: X}
        TSS: {1: Z, 2: AA, 3: AB, 4: AC}
        VSS: {1: AE, 2: AF, 3: AG, 4: AH}
        COD: {1: AJ, 2: AK, 3: AL, 4: AM}
        sCOD: {1: AO, 2: AP, 3: AQ, 4: AR}
        TC: {1: AT, 2: AU, 3: AV, 4: AW}
        Protein: {1: AY, 2: AZ, 3: BA, 4: BB}
        TAN: {1: BD, 2: BE, 3: BF, 4: BG}
        Lipid: {1: BI, 2: BJ, 3: BK, 4: BL}
        TVFAs: {1: BN, 2: BO, 3: BP, 4: BQ}
        "VFAs,Et": {1: BS, 2: BT, 3: BU, 4: BV}
        EtOH: {1: BX, 2: BY, 3: BZ, 4: CA}
        HAc: {1: CC, 2: CD, 3: CE, 4: CF}
        HPro: {1: CH, 2: CI, 3: CJ, 4: CK}
        HBut: {1: CM, 2: CN, 3: CO, 4: CP}
        i-HBut: {1: CR, 2: CS, 3: CT, 4: CU}
        HVal: {1: CW, 2: CX, 3: CY, 4: CZ}
        i-HVal: {1: DB, 2: DC, 3: DD, 4: DE}
        HCap: {1: DG, 2: DH, 3: DI, 4: DJ}
        i-HCap: {1: DL, 2: DM, 3: DN, 4: DO}
      season_header_overrides: {BD: 1, BE: 2, BF: 3, BG: 4}
    effluent:
      name: Chem_Se.Avg
      header_row: 3
      sample_id_column: null
      site_id_column: Site
      site_id_excel_column: C
      acronym_column: Acronym
      acronym_excel_column: D
      record_number_column: No.
      record_number_excel_column: B
      record_number_dtype: string
      season_column: null
      namespace: effluent
      seasonal_measurement_columns:
        pH: {1: E, 2: F, 3: G, 4: H}
        ALK: {1: J, 2: K, 3: L, 4: M}
        TS: {1: O, 2: P, 3: Q, 4: R}
        VS: {1: T, 2: U, 3: V, 4: W}
        TSS: {1: Y, 2: Z, 3: AA, 4: AB}
        VSS: {1: AD, 2: AE, 3: AF, 4: AG}
        COD: {1: AI, 2: AJ, 3: AK, 4: AL}
        sCOD: {1: AN, 2: AO, 3: AP, 4: AQ}
        TC: {1: AS, 2: AT, 3: AU, 4: AV}
        Protein: {1: AX, 2: AY, 3: AZ, 4: BA}
        "NH4-N": {1: BC, 2: BD, 3: BE, 4: BF}
        Lipid: {1: BH, 2: BI, 3: BJ, 4: BK}
        TVFAs: {1: BM, 2: BN, 3: BO, 4: BP}
        "VFAs,Et": {1: BR, 2: BS, 3: BT, 4: BU}
        EtOH: {1: BW, 2: BX, 3: BY, 4: BZ}
        HAc: {1: CB, 2: CC, 3: CD, 4: CE}
        HPro: {1: CG, 2: CH, 3: CI, 4: CJ}
        HBut: {1: CL, 2: CM, 3: CN, 4: CO}
        i-HBut: {1: CQ, 2: CR, 3: CS, 4: CT}
        HVal: {1: CV, 2: CW, 3: CX, 4: CY}
        i-HVal: {1: DA, 2: DB, 3: DC, 4: DD}
        HCap: {1: DF, 2: DG, 3: DH, 4: DI}
        i-HCap: {1: DK, 2: DL, 3: DM, 4: DN}
        CO2: {1: DP, 2: DQ, 3: DR, 4: DS}
        CH4: {1: DU, 2: DV, 3: DW, 4: DX}
        O2: {1: DZ, 2: EA, 3: EB, 4: EC}
        H2S: {1: EE, 2: EF, 3: EG, 4: EH}
      season_header_overrides: {BC: 1, BD: 2, BE: 3, BF: 4}
  reshape_rules:
    emit_seasons: [1, 2, 3, 4]
    retain_all_missing_site_seasons_for_audit: true
  missing_values:
    tokens: ["", "x", "n.a"]
    strip_text_whitespace: true
    preserve_numeric_zero: true
    known_uncached_formula_cells:
      Chem_Se.Avg: [BC39, BC40]
  site_id_aliases:
    substrate: {}
    effluent:
      MGYe2: MGY
  join:
    duplicate_policy: error
    assert_matching_nonmissing_acronyms: true
    unresolved_effluent_site_ids: [MGYe1]
columns:
  sample_id: sample_id
  site_id: site_id
  target: null   # BLOCKER: set to an approved column name, or a warning_* flag, before training.
  covariates: []
preprocessing:
  detection_count: 5
  min_detected_samples: 5
  min_sample_prevalence: 0.10
  min_detected_sites: 3
  min_site_prevalence: 0.10
  pseudocount: 0.5
  sensitivity_pseudocounts: [1.0]
  standardize_target: true
  standardize_microbial_columns: false
  relative_input_mode: false
  missing_retained_feature_means_zero: false
graph:
  k_phylogeny: 5
  k_abundance: 5
  min_joint_samples: 10
  min_joint_sites: 5
  empirical_score: max_all_and_joint_lrv
  bootstrap_sites: 500
  support_threshold: 0.80
  approximate_bootstrap: false
  approximate_candidate_k: 20
cv:
  outer_folds: 6
  inner_folds: 4
  selection_metric: site_balanced_mse
  selection_rule: one_standard_error
  required_validation_coverage: 1.0
  families: null
search:
  candidate_budget_per_family: 48
  lambda_s: [0, 0.001, 0.01, 0.1]
  lambda_r: [0.001, 0.01, 0.1, 1]
  lambda_f: [0, 0.1, 1, 10, 100, 1000]
  alpha_arc: [0, 0.5, 1]
  alpha_bac: [0, 0.5, 1]
  exhaustive: false
solver:
  preferred: CLARABEL
  fallback: OSQP
  equality_tolerance: 1.0e-6
  max_retries: 3
  time_limit_seconds: 120
compression:
  coefficient_tolerance: 1.0e-6
  keep_residual_coefficients: true
optional:
  b12_comparator: false
  cross_domain_interactions: false
output_dir: ../../results/classification result/fusionML/real_results
run_id: real_research
smoke: false
